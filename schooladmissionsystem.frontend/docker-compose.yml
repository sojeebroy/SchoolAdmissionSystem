services:
  schooladmissionsystem-frontend:
    container_name: schooladmissionsystem-frontend-container
    image: schooladmissionsystem-frontend-image
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - .:/frontend                  
      - /frontend/node_modules       
    networks:
      - school-network 
 
volumes:
  schooladmissionsystem-frontend-volumes:
    name: schooladmissionsystem-frontend-volumes
   
networks:
  school-network:
    driver: bridge